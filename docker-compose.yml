services:
  postgres:
    image: postgres:17
    container_name: hydrogen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hydrogen_pipeline
      POSTGRES_USER: hydrogen_user
      POSTGRES_PASSWORD: hydrogen_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hydrogen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: